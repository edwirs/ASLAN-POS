{% extends 'list.html' %}

{% block body_class %}
sidebar-collapse
{% endblock %}

{% load static %}

{% block assets_list %}
    <script src="{% static 'lib/select2-4.0.13/js/select2.min.js' %}"></script>
    <script src="{% static 'lib/select2-4.0.13/js/i18n/es.js' %}"></script>
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2-bootstrap4.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2-bootstrap4.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/bootstrap-touchspin-4.2.5/css/jquery.bootstrap-touchspin.css' %}"/>
    <script src="{% static 'lib/bootstrap-touchspin-4.2.5/js/jquery.bootstrap-touchspin.js' %}"></script>
    <script src="{% static 'lib/bootstrap-daterangepicker-3.1/js/spanish.js' %}"></script>
    <script src="{% static 'lib/bootstrap-daterangepicker-3.1/js/daterangepicker.js' %}"></script>
    <link rel="stylesheet" href="{% static 'lib/bootstrap-daterangepicker-3.1/css/daterangepicker.css' %}"/>
    <script src="{% static 'kitchen_order/js/form.js' %}"></script>
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="{% static 'lib/adminlte-3.2.0/plugins/toastr/toastr.min.css' %}">
    <!-- Toastr JS -->
    <script src="{% static 'lib/adminlte-3.2.0/plugins/toastr/toastr.min.js' %}"></script>

    <style>
        
        
        .kitchen-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,.15);
            padding: 16px;
            margin-bottom: 20px;
            border-left: 6px solid #28a745; /* verde = activo */
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .kitchen-card.warning {
            border-left-color: #fd7e14;
            background: #fff8f1;
        }

        .kitchen-card.danger {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .time-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            color: #fff;
        }

        .time-ok { background: #28a745; }
        .time-warning { background: #fd7e14; }
        .time-danger { background: #dc3545; }

        .kitchen-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,.2);
        }

        /* HEADER */
        .kitchen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
        }

        .status-badge {
            background: #28a745;
            color: #fff;
            font-size: .75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: .5px;
        }

        /* ITEMS */
        .kitchen-items {
            margin-top: 10px;
        }

        .kitchen-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px dashed #ddd;
        }

        .kitchen-item:last-child {
            border-bottom: none;
        }

        .kitchen-actions {
            margin-top: 14px;
            display: flex;
            justify-content: flex-end;
        }

        .kitchen-actions .btn-ready {
            border-radius: 999px !important;             /* más redondeado */
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 14px;

            background-color: #e9ecef;        /* verde pastel */
            border: none;
            color: #1f3d2b;

            box-shadow: 0 3px 8px rgba(0,0,0,.12);
            transition: all .15s ease;
        }

        .kitchen-actions .btn-ready:hover {
            background-color: #7cc89a;        /* un poco más fuerte */
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0,0,0,.18);
        }

        .kitchen-actions .btn-ready:active {
            transform: scale(0.98);
        }

        .qty {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f8d7da;
            color: #721c24;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .product {
            flex: 1;
            color: #333;
            line-height: 1.3;
        }
    </style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row g-4" id="kitchen-board"></div>
</div>
{% endblock %}

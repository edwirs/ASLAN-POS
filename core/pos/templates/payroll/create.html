{% extends 'form.html' %}
{% load static %}
{% block assets_form %}
    <script src="{% static 'lib/select2-4.0.13/js/select2.min.js' %}"></script>
    <script src="{% static 'lib/select2-4.0.13/js/i18n/es.js' %}"></script>
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2-bootstrap4.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/bootstrap-touchspin-4.2.5/css/jquery.bootstrap-touchspin.css' %}"/>
    <script src="{% static 'lib/bootstrap-touchspin-4.2.5/js/jquery.bootstrap-touchspin.js' %}"></script>
    <script src="{% static 'lib/tempusdominus-bootstrap-4.5.37.0/js/tempusdominus-bootstrap.js' %}"></script>
    <link rel="stylesheet" href="{% static 'lib/tempusdominus-bootstrap-4.5.37.0/css/tempusdominus-bootstrap.css' %}"/>
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="{% static 'lib/adminlte-3.2.0/plugins/toastr/toastr.min.css' %}">
    <!-- Toastr JS -->
    <script src="{% static 'lib/adminlte-3.2.0/plugins/toastr/toastr.min.js' %}"></script>
    <script>
        const list_url = "{{ list_url }}";
    </script>
    <script src="{% static 'payroll/js/form.js' %}"></script>
{% endblock %}

{% block form_fields %}
    <div class="col-md-6 col-lg-4">
        <label class="form-label fw-bold">{{ form.period_type.label }}</label>
        {{ form.period_type }}
    </div>

    <table id="tblPayroll" class="table table-bordered">
      <thead class="">
        <tr>
          <th >Empleado</th>
          <th>Salario</th>
          <th>Días</th>
          <th>Horas Extra</th>
          <th>Otros Ingresos</th>
          <th>Deducciones</th>
          <th>Seguridad Social</th>
          <th>Total Estimado</th>
        </tr>
      </thead>
    </table>

{% endblock %}

{% block buttons %}
    <button type="button" class="btn btn-primary" id="btnSaveAll">
        <i class="fas fa-save"></i> Liquidar Nómina
    </button>
    <a href="{{ list_url }}" class="btn btn-danger">
        <i class="fas fa-times"></i> Cancelar
    </a>
{% endblock %}

{% extends 'form.html' %}
{% load static %}
{% block assets_form %}
    <script src="{% static 'lib/select2-4.0.13/js/select2.min.js' %}"></script>
    <script src="{% static 'lib/select2-4.0.13/js/i18n/es.js' %}"></script>
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2-bootstrap4.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/bootstrap-touchspin-4.2.5/css/jquery.bootstrap-touchspin.css' %}"/>
    <script src="{% static 'lib/bootstrap-touchspin-4.2.5/js/jquery.bootstrap-touchspin.js' %}"></script>
    <script src="{% static 'lib/tempusdominus-bootstrap-4.5.37.0/js/tempusdominus-bootstrap.js' %}"></script>
    <link rel="stylesheet" href="{% static 'lib/tempusdominus-bootstrap-4.5.37.0/css/tempusdominus-bootstrap.css' %}"/>
    <script>var initial_products = {{ details_json|safe }};</script>
    <script src="{% static 'employee_transaction/js/form.js' %}"></script>
{% endblock %}

{% block form_fields %}
<div class="row g-3">

    <!-- EMPLEADO -->
    <div class="col-md-6 col-lg-3">
        <label class="form-label fw-bold">{{ form.employee.label }}</label>
        {{ form.employee }}
    </div>

    <!-- TIPO -->
    <div class="col-md-6 col-lg-3">
        <label class="form-label fw-bold">{{ form.transaction_type.label }}</label>
        {{ form.transaction_type }}
    </div>

    <!-- ORIGEN -->
    <div class="col-md-6 col-lg-3">
        <label class="form-label fw-bold">{{ form.source.label }}</label>
        {{ form.source }}
    </div>

    <!-- VALOR -->
    <div class="col-md-6 col-lg-3 field-amount">
        <label class="form-label fw-bold">{{ form.amount.label }}</label>
        {{ form.amount }}
    </div>

    <!-- OBSERVACION -->
    <div class="col-md-12">
        <label class="form-label fw-bold">{{ form.description.label }}</label>
        {{ form.description }}
    </div>
</div>

<hr>

<!-- =========================
     PRODUCTOS (NUEVO)
========================= -->
<div class="card mt-3" id="card-products">
    <div class="card-header">
        <h5 class="mb-0">Productos</h5>
    </div>
    <div class="card-body">

        <div class="mb-3">
            <select id="select_product" class="form-control select2">
                <option value="">Buscar producto...</option>
                {% for p in products %}
                    <option value="{{ p.id }}" data-price="{{ p.price }}">
                        {{ p.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <table class="table table-bordered" id="tblProducts">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th width="120">Cantidad</th>
                    <th width="120">Precio</th>
                    <th width="120">Subtotal</th>
                    <th width="50"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>
</div>

{% endblock %}

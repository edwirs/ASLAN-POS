{% extends 'report.html' %}
{% load static %}

{% block assets_report %}
<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="{% static 'sale_by_product_report/js/report.js' %}"></script>
{% endblock %}

{% block content_report %}
<div class="row mb-3">
    <div class="col-lg-5 col-md-12">
        <label class="form-label fw-bold">{{ form.date_range.label }}</label>
        <div class="input-group">
            {{ form.date_range }}
            <button class="btn btn-primary btnSearchAll">
                <i class="fas fa-calendar-check"></i> Todas
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-12">
        <div id="container" style="height: 500px;"></div>
    </div>
</div>
{% endblock %}
